# Today's Nifty 50. At each year-end or quarter-end, buy the best full
# prior period. A quarter resets four times a year and scores the trailing
# year into that quarter-end (150 prints, including the quarter-end a year
# earlier). A year uses the calendar year and 150 prints.
# Prices stay in rupees: currency is marked USD only so the engine does not
# convert NSE quotes. total_return folds splits and dividends into the path.
# Survivorship: names that left the index, or no longer have a Yahoo series,
# are absent. A name competes only after it has a full calendar year.
name: nifty-winner
timeframe: 1d
from: 2000-01-01
source: yahoo
clock: xnse
total_return: true
allow_short: false
initial_equity: 100
universe:
