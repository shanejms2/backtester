global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          project: backtester-obs
          service: prometheus

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          project: backtester-obs
          service: alloy

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          project: backtester-obs
          service: loki

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          project: backtester-obs
          service: grafana

  # Reachable via shared Docker network "backtester_default".
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          project: backtester
          service: clickhouse

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          project: backtester
          service: postgres
