services:
  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.8
    mem_limit: 3g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9363:9363"
    environment:
      CLICKHOUSE_DB: backtester
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config.d/logger.xml:/etc/clickhouse-server/config.d/99-backtester-logger.xml:ro
      - ./infra/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/99-backtester-prometheus.xml:ro
      - ./data:/var/lib/clickhouse/user_files/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: backtester
      POSTGRES_USER: ${POSTGRES_USER:-backtester}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-backtester}
      BACKTESTER_API_KEY: ${BACKTESTER_API_KEY:?set BACKTESTER_API_KEY in .env}
      BACKTESTER_TZ: ${BACKTESTER_TZ:-UTC}
      BACKTESTER_API_MAX_BARS: ${BACKTESTER_API_MAX_BARS:-10000}
      BACKTESTER_CORS_ORIGINS: ${BACKTESTER_CORS_ORIGINS:-}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  clickhouse_data:
  postgres_data:
